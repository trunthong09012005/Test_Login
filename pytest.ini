[pytest]
testpaths = tests
pythonpath = .
addopts = -v -ra --strict-markers --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml
markers =
    smoke: Validation và hiển thị, không cần mật khẩu thật.
    credentials: Cần UTC_USER và UTC_PASS hợp lệ.
    session: Kiểm tra ghi nhớ đăng nhập, đăng xuất và phiên.
    rate_limit: TC21 thử sai liên tiếp, chạy với --run-sensitive.
    security: TC24-TC25 payload kiểm tra bảo mật, chạy với --run-sensitive.
